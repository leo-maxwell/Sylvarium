<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606d"/></marker></defs>
  <rect width="1200" height="640" fill="#f7f4ef"/>
  <text x="600" y="42" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="700" fill="#1f2933">这台主机的真实出站路径</text>
  <rect x='250' y='82' width='700' height='62' rx='14' fill='#ffffff' stroke='#52606d' stroke-width='2'/><text x='600' y='107' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='22' font-weight='600' fill='#1f2933'>Windows TCP/IP</text><text x='600' y='130' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='15' fill='#616e7c'>Chromium 实际使用的主机网络栈</text>
  <rect x='250' y='172' width='700' height='62' rx='14' fill='#ffffff' stroke='#52606d' stroke-width='2'/><text x='600' y='197' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='22' font-weight='600' fill='#1f2933'>vEthernet (AX200 Switch)</text><text x='600' y='220' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='15' fill='#616e7c'>管理操作系统的 IPv6 接口</text>
  <rect x='250' y='262' width='700' height='62' rx='14' fill='#ffffff' stroke='#52606d' stroke-width='2'/><text x='600' y='287' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='22' font-weight='600' fill='#1f2933'>Hyper-V Extensible Switch</text><text x='600' y='310' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='15' fill='#616e7c'>完整 LSO NBL 在这里快速穿行</text>
  <rect x='250' y='352' width='700' height='62' rx='14' fill='#ffffff' stroke='#52606d' stroke-width='2'/><text x='600' y='377' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='22' font-weight='600' fill='#1f2933'>Microsoft Network Bridge</text><text x='600' y='400' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='15' fill='#616e7c'>bridge.sys，两条可观测 edge</text>
  <rect x='250' y='442' width='700' height='62' rx='14' fill='#ffffff' stroke='#52606d' stroke-width='2'/><text x='600' y='467' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='22' font-weight='600' fill='#1f2933'>Multiplexor / NDISIMPLATFORM</text><text x='600' y='490' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='15' fill='#616e7c'>NdisImPlatform.sys，PowerShell 中名为“网桥”</text>
  <rect x='250' y='532' width='700' height='62' rx='14' fill='#ffffff' stroke='#52606d' stroke-width='2'/><text x='600' y='557' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='22' font-weight='600' fill='#1f2933'>Intel AX200 Wi-Fi</text><text x='600' y='580' text-anchor='middle' font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size='15' fill='#616e7c'>物理 miniport；失败的完整 LSO 从未抵达此处</text>
  <line x1='600' y1='144' x2='600' y2='170' stroke='#52606d' stroke-width='3' marker-end='url(#arrow)'/>
  <line x1='600' y1='234' x2='600' y2='260' stroke='#52606d' stroke-width='3' marker-end='url(#arrow)'/>
  <line x1='600' y1='324' x2='600' y2='350' stroke='#52606d' stroke-width='3' marker-end='url(#arrow)'/>
  <line x1='600' y1='414' x2='600' y2='440' stroke='#52606d' stroke-width='3' marker-end='url(#arrow)'/>
  <line x1='600' y1='504' x2='600' y2='530' stroke='#52606d' stroke-width='3' marker-end='url(#arrow)'/>
  <path d="M 965 105 C 1090 105, 1090 555, 965 555" fill="none" stroke="#d64545" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="1080" y="310" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="600" fill="#b42318" transform="rotate(90 1080 310)">关掉物理 WLAN 的 IPv6，并不会移除上面的 vEthernet IPv6 路径</text>
</svg>
